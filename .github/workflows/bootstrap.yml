name: mise bootstrap check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install: false  # only the mise binary is needed; [tools] are not CI's concern
      - if: ${{ matrix.os == 'macos-26' }}
        run: brew uninstall azure-cli google-chrome
      - run: mise trust
      - run: make mise-up
      - run: make brew-up
      - if: ${{ matrix.os == 'macos-26' }}
        run: |
          export PATH=$PATH:/opt/homebrew/bin
          make krew-up
      - if: ${{ matrix.os == 'ubuntu-26.04' }}
        run: |
          export PATH=$PATH:/home/linuxbrew/.linuxbrew/bin
          make krew-up
