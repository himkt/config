name: mise bootstrap check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: false  # only the mise binary is needed; [tools] are not CI's concern
      - name: Remove pre-installed packages by homebrew
        if: ${{ matrix.os == 'macos-26' }}
        run: brew uninstall google-chrome
      - run: make bootstrap-check
