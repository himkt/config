name: mise bootstrap check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false  # only the mise binary is needed; [tools] are not CI's concern
      - run: mise trust
      - name: Remove pre-installed packages by homebrew
        if: ${{ matrix.os == 'macos-26' }}
        run: brew uninstall google-chrome
      - run: make up
