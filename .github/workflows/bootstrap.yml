name: mise bootstrap check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: false  # only the mise binary is needed; [tools] are not CI's concern
      - run: make bootstrap-check
