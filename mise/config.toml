"aqua:derailed/k9s" = "v0.51.0"
"aqua:earendil-works/pi" = "v1.5.0"
"aqua:git-lfs/git-lfs" = "v3.8.1"
"aqua:hashicorp/terraform" = "v1.17.1"
"aqua:jdx/jactionlint" = "v2.5.0"
"aqua:jqlang/jq" = "1.8.2"
"aqua:junegunn/fzf" = "v0.74.5"
"aqua:Kitware/CMake" = "v4.4.5"
