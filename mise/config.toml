min_version = "2026.8.14"

[dotfiles]
"~/.claude" = { source = "../claude", mode = "symlink-each" }
"~/.codex/hooks.json" = "../codex/hooks.json"
"~/.local/bin/gh_api_guard.py" = "../bin/gh_api_guard.py"
"~/.codex/rules" = { source = "../codex/rules", mode = "symlink-each" }
"~/.config/ghostty" = "../ghostty"
"~/.config/git" = "../git"
"~/.config/herdr" = { source = "../herdr", mode = "symlink-each" }
"~/.config/mise" = { source = "../mise", mode = "symlink-each" }
"~/.config/nvim" = "../nvim"
"~/.config/sheldon" = "../sheldon"
"~/.config/tmux" = "../tmux"
"~/.config/uv" = "../uv"
"~/.zshrc" = "../zsh/zshrc"

[bootstrap.packages]
"brew:agent-browser" = "latest"
"brew:azure-cli" = "latest"
"brew:binutils" = "latest"
"brew:btop" = "latest"
"brew:coreutils" = "latest"
"brew:git" = "latest"
"brew:himkt/tap/cafleet" = "latest"
"brew:himkt/tap/pathfinder" = "latest"
"brew:less" = "latest"
"brew:libpq" = "latest"
"brew:rustup" = "latest"
"brew:tree" = "latest"
"brew:unzip" = "latest"
"brew:zip" = "latest"
"brew:zsh" = "latest"
"brew-cask:1password" = { os = "macos", version = "latest" }
"brew-cask:chatgpt" = { os = "macos", version = "latest" }
"brew-cask:claude" = { os = "macos", version = "latest" }
"brew-cask:discord" = { os = "macos", version = "latest" }
"brew-cask:font-jetbrains-mono" = { os = "macos", version = "latest" }
"brew-cask:font-noto-sans-cjk" = { os = "macos", version = "latest" }
"brew-cask:ghostty" = { os = "macos", version = "latest" }
"brew-cask:google-chrome" = { os = "macos", version = "latest" }
"brew-cask:himkt/tap/voicevox" = { os = "macos", version = "latest" }
"brew-cask:inkscape" = { os = "macos", version = "latest" }
"brew-cask:insomnia" = { os = "macos", version = "latest" }
"brew-cask:netron" = { os = "macos", version = "latest" }
"brew-cask:notion" = { os = "macos", version = "latest" }
"brew-cask:nvidia-nsight-systems" = { os = "macos", version = "latest" }
"brew-cask:obs" = { os = "macos", version = "latest" }
"brew-cask:quo" = { os = "macos", version = "latest" }
"brew-cask:rancher" = { os = "macos", version = "latest" }
"brew-cask:slack" = { os = "macos", version = "latest" }
"brew-cask:visual-studio-code" = { os = "macos", version = "latest" }

[bootstrap.macos.dock]
autohide = true
orientation = "left"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 20

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
NSGlobalDomain = { ApplePressAndHoldEnabled = false, "com.apple.keyboard.fnState" = false }

[tools]
"aqua:ahmetb/kubectx" = "v0.11.0"
"aqua:anomalyco/opencode" = "v1.18.21"
"aqua:ajeetdsouza/zoxide" = "v0.10.0"
"aqua:anthropics/claude-code" = "v2.1.240"
"aqua:astral-sh/uv" = "0.12.5"
"aqua:BurntSushi/ripgrep" = "15.2.0"
"aqua:cli/cli" = "v2.98.0"
"aqua:derailed/k9s" = "v0.51.0"
"aqua:git-lfs/git-lfs" = "v3.7.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:junegunn/fzf" = "v0.74.3"
"aqua:kubernetes-sigs/kustomize" = "v5.8.1"
"aqua:kubernetes-sigs/krew" = "v0.5.0"
"aqua:kubernetes/kubernetes/kubectl" = "v1.36.4"
"aqua:neovim/neovim" = "v0.12.4"
"aqua:ogulcancelik/herdr" = "v0.8.2"
"aqua:openai/codex" = "v0.149.0"
"aqua:pnpm/pnpm" = "11.22.0"
"aqua:rossmacarthur/sheldon" = "0.8.5"
"aqua:suzuki-shunsuke/pinact" = "v4.1.1"
"aqua:tmux/tmux-builds" = "v3.6a"
