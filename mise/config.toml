min_version = "2026.7.18"

[dotfiles]
"~/.bashrc" = "../bash/bashrc"
"~/.claude" = { source = "../claude", mode = "symlink-each" }
"~/.config/ghostty" = "../ghostty"
"~/.config/git" = "../git"
"~/.config/herdr" = { source = "../herdr", mode = "symlink-each" }
"~/.config/mise" = { source = "../mise", mode = "symlink-each" }
"~/.config/nvim" = "../nvim"
"~/.config/sheldon" = "../sheldon"
"~/.config/tmux" = "../tmux"
"~/.config/uv" = "../uv"
"~/.zshrc" = "../zsh/zshrc"

[bootstrap.packages]
# mise itself is deliberately absent: brew owns its install (brew/Brewfile)
"brew:binutils" = "latest"
"brew:btop" = "latest"
"brew:coreutils" = "latest"
"brew:git" = "latest"
"brew:himkt/tap/cafleet" = "latest"
"brew:himkt/tap/pathfinder" = "latest"
"brew:less" = "latest"
"brew:libpq" = "latest"
"brew:rustup" = "latest"
"brew:tree" = "latest"
"brew:unzip" = "latest"
"brew:zip" = "latest"
"brew:zsh" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:himkt/tap/voicevox" = "latest"
"brew-cask:inkscape" = "latest"
"brew-cask:insomnia" = "latest"
"brew-cask:netron" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:nvidia-nsight-systems" = "latest"
"brew-cask:obs" = "latest"
"brew-cask:quo" = "latest"
"brew-cask:rancher" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:font-jetbrains-mono" = "latest"
"brew-cask:font-noto-sans-cjk" = "latest"

[bootstrap.macos.dock]
autohide = true
orientation = "left"

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 20

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
NSGlobalDomain = { ApplePressAndHoldEnabled = false, "com.apple.keyboard.fnState" = false }

[tools]
"aqua:ahmetb/kubectx" = "v0.11.0"
"aqua:anomalyco/opencode" = "v1.18.7"
"aqua:ajeetdsouza/zoxide" = "v0.10.0"
"aqua:anthropics/claude-code" = "v2.1.220"
"aqua:astral-sh/uv" = "0.11.32"
"aqua:BurntSushi/ripgrep" = "15.2.0"
# FIXME(himkt): btop does not release binaries for macOS
# "aqua:aristocratos/btop" = "latest"
"aqua:cli/cli" = "v2.96.0"
"aqua:derailed/k9s" = "v0.51.0"
"aqua:git-lfs/git-lfs" = "v3.7.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:junegunn/fzf" = "v0.74.1"
"aqua:kubernetes-sigs/kustomize" = "v5.8.1"
"aqua:kubernetes-sigs/krew" = "v0.5.0"
"aqua:kubernetes/kubernetes/kubectl" = "v1.36.3"
"aqua:neovim/neovim" = "v0.12.4"
"aqua:ogulcancelik/herdr" = "v0.7.5"
"aqua:openai/codex" = "v0.145.0"
"aqua:pnpm/pnpm" = "11.17.0"
"aqua:rossmacarthur/sheldon" = "0.8.5"
"aqua:suzuki-shunsuke/pinact" = "v4.1.0"
"aqua:tmux/tmux-builds" = "v3.6a"
"asdf:mise-plugins/mise-gcloud" = "v569.0.0"
"core:java" = "26.0.1"
"core:node" = "26.5.0"
"core:rust" = "1.97.1"
"core:zig" = "v0.15.2"

[settings]
all_compile = false
experimental = true
idiomatic_version_file_enable_tools = []
